<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: main-layout(~{::#approve-content}, 'Phê duyệt lịch hẹn', 'appointments')}">
<body>

<div id="approve-content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg rounded-4">
                    <div class="card-header bg-success text-white py-3 rounded-top-4">
                        <h4 class="mb-0"><i class="fas fa-check-circle me-2"></i>Phê duyệt & Chỉ định phòng Lab</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/lecturer/booking/approve/confirm}" method="post">
                            <input type="hidden" name="sessionId" th:value="${mentoringSession.id}">

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="small text-muted text-uppercase fw-bold">Sinh viên yêu cầu</label>
                                    <p class="fw-bold mb-0" th:text="${mentoringSession.student.fullName}">Nguyễn Văn A</p>
                                    <small th:text="${mentoringSession.student.email}"></small>
                                </div>
                                <div class="col-md-6">
                                    <label class="small text-muted text-uppercase fw-bold">Thời gian dự kiến</label>
                                    <p class="fw-bold mb-0" th:text="${#temporals.format(mentoringSession.startTime, 'dd/MM/yyyy HH:mm')}"></p>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Nội dung hỗ trợ</label>
                                <div class="p-3 bg-light rounded-3 italic" th:text="${mentoringSession.topic}"></div>
                            </div>

                            <hr class="my-4">

                            <div class="mb-3">
                                <label for="labId" class="form-label fw-bold text-primary">Chỉ định phòng Lab <span class="text-danger">*</span></label>
                                <select name="labId" id="labId" class="form-select form-select-lg" required>
                                    <option value="" selected disabled>-- Chọn phòng Lab còn trống --</option>
                                    <option th:each="lab : ${labs}"
                                            th:value="${lab.id}"
                                            th:text="${lab.name + ' (Sức chứa: ' + lab.capacity + ')'}">Phòng 101</option>
                                </select>
                            </div>

                            <!-- Thêm vào bên dưới phần chọn Lab -->
                            <div class="mb-3">
                                <label for="equipmentId" class="form-label fw-bold text-primary">Yêu cầu thiết bị hỗ trợ (Nếu cần)</label>
                                <select name="equipmentId" id="equipmentId" class="form-select">
                                    <option value="">-- Không cần thiết bị --</option>
                                    <option th:each="equi : ${equipments}"
                                            th:value="${equi.id}"
                                            th:text="${equi.name + ' (Còn lại: ' + equi.availableQuantity + ')'}"></option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="note" class="form-label fw-bold">Ghi chú cho sinh viên</label>
                                <textarea name="note" id="note" class="form-control" rows="3"
                                          placeholder="Hướng dẫn sinh viên khi đến phòng Lab..."></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/lecturer/appointments}" class="btn btn-outline-secondary px-4 rounded-pill">Quay lại</a>
                                <button type="submit" class="btn btn-success px-5 rounded-pill shadow-sm">
                                    <i class="fas fa-check me-2"></i>Xác nhận duyệt
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
