<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"
          th:if="${successMessage}"
          http-equiv="refresh"
          content="2;url=/auth/login"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Smart Academic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --subtle-blue: #f0f7ff;
            --accent-color: #007bff;
            --text-main: #2c3e50;
            --border-color: #e9ecef;
            --error-color: #dc3545;
        }

        .success-alert {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;

            min-width: 320px;
            max-width: 420px;
            width: fit-content;

            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

            /* Hiệu ứng xuất hiện và tự biến mất */
            animation:
                    slideInRight 0.35s ease-out,
                    fadeOut 0.5s ease-in forwards;
            animation-delay:
                    0s,
                    1.5s;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
                height: 0;
                margin: 0;
                padding-top: 0;
                padding-bottom: 0;
                overflow: hidden;
            }
        }

        body {
            background-color: #fdfdfd;
            background-image: radial-gradient(#d1d9e6 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            max-width: 500px; /* Register cần rộng hơn một chút so với Login */
            width: 100%;
            margin: 40px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .lab-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .lab-icon {
            width: 48px;
            height: 48px;
            background: var(--subtle-blue);
            color: var(--accent-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 12px;
            background: #e1f5fe;
            color: #01579b;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 6px;
        }

        .form-control {
            padding: 11px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background-color: #fafafa;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0069d9;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.2);
        }

        .error-text {
            color: var(--error-color);
            font-size: 0.75rem;
            margin-top: 4px;
            font-weight: 500;
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .footer-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* Chia cột cho mật khẩu trên màn hình lớn */
        @media (min-width: 576px) {
            .row-custom {
                display: flex;
                gap: 15px;
            }
            .col-custom {
                flex: 1;
            }
        }
    </style>
</head>
<body>

<div class="container">


    <div th:if="${successMessage}"
         class="alert alert-success small mb-4 success-alert"
         role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div class="auth-card">
        <div class="lab-brand">
            <div class="lab-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <span class="status-tag">Registration Terminal</span>
            <h4 class="fw-bold m-0">Tạo tài khoản mới</h4>
            <p class="text-muted small">Đăng ký để tham gia hệ thống học thuật</p>
        </div>

        <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
            <!-- Họ và tên -->
            <div class="mb-3">
                <label class="form-label">Họ và tên sinh viên</label>
                <input type="text" class="form-control" th:field="*{username}" placeholder="Nguyễn Văn A">
                <div class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email học thuật</label>
                <input type="text" class="form-control" th:field="*{email}" placeholder="username@gmail.com">
                <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                <div class="error-text" th:if="${emailError}" th:text="${emailError}"></div>
            </div>

            <!-- Mật khẩu -->
            <div class="row-custom">
                <div class="col-custom mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••">
                    <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="col-custom mb-3">
                    <label class="form-label">Xác nhận</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="••••••••">
                    <div class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Kích hoạt tài khoản</button>
        </form>

        <div class="footer-link text-muted">
            Đã là thành viên phòng Lab? <br>
            <a th:href="@{/auth/login}">Đăng nhập ngay</a>
        </div>
    </div>

    <div class="text-center mt-2 mb-4 text-muted" style="font-size: 0.75rem; opacity: 0.6;">
        © 2026 Pham Tien Hung to reverse
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
