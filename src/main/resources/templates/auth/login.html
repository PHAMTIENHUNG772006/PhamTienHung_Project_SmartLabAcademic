<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academic - Light Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --subtle-blue: #f0f7ff;
            --accent-color: #007bff;
            --text-main: #2c3e50;
            --border-color: #e9ecef;
        }

        .auto-hide-alert {
            animation: fadeOut 1s forwards;
            animation-delay: 1s;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
                height: 0;
                margin: 0;
                padding-top: 0;
                padding-bottom: 0;
            }
        }

        body {
            background-color: #fdfdfd;
            /* Họa tiết lưới cực nhẹ, chỉ thấy khi nhìn kỹ */
            background-image: radial-gradient(#d1d9e6 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            max-width: 420px;
            width: 100%;
            margin: auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }

        .lab-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .lab-icon {
            width: 48px;
            height: 48px;
            background: var(--subtle-blue);
            color: var(--accent-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 8px;
        }

        .form-control {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0069d9;
            transform: translateY(-1px);
        }

        .status-tag {
            display: inline-block;
            padding: 4px 12px;
            background: #e1f5fe;
            color: #01579b;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .footer-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-card">
        <div class="lab-brand">
            <div class="lab-icon">
                <i class="bi bi-intersect"></i>
            </div>
            <span class="status-tag">Lab Support Platform</span>
            <h4 class="fw-bold m-0">Chào mừng trở lại</h4>
            <p class="text-muted small">Đăng nhập để vào hệ thống học thuật</p>
        </div>

        <!-- Thông báo tài khoản bị khóa -->
        <div th:if="${lockAccount}"
             id="lock-alert"
             class="alert alert-danger alert-dismissible fade show small mb-4  auto-hide-alert"
             role="alert">
            <i class="bi bi-lock-fill me-2"></i>
            <span th:text="${lockAccount}"></span>
        </div>

        <form th:action="@{/auth/login}" method="post">

            <div class="mb-3">
                <label class="form-label">Email sinh viên</label>
                <input type="email" name="email"
                       th:classappend="${emailError != null} ? 'is-invalid' : ''"
                       class="form-control" placeholder="name@student.vn">
                <div class="text-danger small mt-1" th:if="${emailError}" th:text="${emailError}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password"
                       th:classappend="${passwordError != null} ? 'is-invalid' : ''"
                       class="form-control" placeholder="••••••••">
                <div class="text-danger small mt-1" th:if="${passwordError}" th:text="${passwordError}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>

        <div class="footer-link text-muted">
            Bạn chưa có tài khoản? <br>
            <a th:href="@{/auth/register}">Tạo tài khoản Lab mới</a>
        </div>
    </div>

    <div class="text-center mt-2 mb-4 text-muted" style="font-size: 0.75rem; opacity: 0.6;">
        © 2026 Pham Tien Hung to reverse
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
