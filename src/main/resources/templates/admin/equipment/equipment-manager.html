<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: main-layout(~{::#admin-dashboard}, 'Quản trị - SmartAcademic', 'equipments')}">
<head>
    <meta charset="UTF-8">
</head>
<style>
    .fade-out-auto {
        animation: fadeOut 0.3s ease-out 1s forwards;
    }

    @keyframes fadeOut {
        from { opacity: 1; transform: translateY(0); }
        to {
            opacity: 0;
            transform: translateY(-20px);
            display: none;
            visibility: hidden;
        }
    }


</style>
<body>

<div id="admin-dashboard">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
          <h3 class="fw-bold mb-1">Quản lý thiết bị Lap</h3>
          <p class="text-secondary">Quản lý và giám sát danh sách thiết bị phòng lap</p>
      </div>
        <div>
            <a th:href="@{/admin/equipments/add}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i> Thêm mới
            </a>
        </div>
    </div>



    <div class="bg-white p-4 rounded-4 shadow-sm">

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4 fade-out-auto" role="alert">
            <div class="d-flex align-items-center">
                <i class="fas fa-exclamation-circle me-2 fs-4"></i>
                <span th:text="${error}">Nội dung lỗi</span>
            </div>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm mb-4 fade-out-auto" role="alert">
            <div class="d-flex align-items-center">
                <i class="fas fa-check-circle me-2 fs-4"></i>
                <span th:text="${success}">Xóa thành công</span>
            </div>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th class="py-3">STT</th>
                    <th class="py-3">ID</th>
                    <th class="py-3">Tên thiết bị</th>
                    <th class="py-3">Mô tả</th>
                    <th class="py-3">Số lượng</th>
                    <th class="py-3 text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, state : ${equipments}">
                    <td th:text="${state.index + 1}">1</td>
                    <td class="fw-bold" th:text="${item.id}">#EQ-001</td>
                    <td th:text="${item.name}">Kính hiển vi quang học</td>
                    <td class="text-truncate" style="max-width: 200px;" th:text="${item.description}">
                        Mô tả thiết bị ở đây...
                    </td>
                    <td>
                        <span class="badge bg-info-subtle text-info px-3 py-2" th:text="${item.availableQuantity}">10</span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/admin/equipments/edit/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-warning" title="Sửa">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/admin/equipments/delete/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Bạn có chắc muốn xóa thiết bị này không?')" title="Xóa">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(equipments.content)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fas fa-box-open d-block mb-2 fs-2"></i>
                        Chưa có thiết bị nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>

            <nav th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/equipment(page=${currentPage - 1})}">Previous</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:text="${i + 1}" th:href="@{/admin/equipment(page=${i})}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/equipment(page=${currentPage + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

</body>
</html>
