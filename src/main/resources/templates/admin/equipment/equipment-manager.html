<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: main-layout(~{::#admin-dashboard}, 'Quản trị - SmartAcademic', 'equiment-manager')}">
<body>

<div id="admin-dashboard">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
          <h3 class="fw-bold mb-1">Quản lý thiết bị Lap</h3>
          <p class="text-secondary">Quản lý và giám sát danh sách thiết bị phòng lap</p>
      </div>
        <div>
            <a th:href="@{/admin/equipments/add}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i> Thêm mới
            </a>
        </div>
    </div>



    <div class="bg-white p-4 rounded-4 shadow-sm">

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
            <div class="d-flex align-items-center">
                <i class="fas fa-exclamation-circle me-2 fs-4"></i>
                <span th:text="${error}">Nội dung lỗi</span>
            </div>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
            <div class="d-flex align-items-center">
                <i class="fas fa-check-circle me-2 fs-4"></i>
                <span th:text="${success}">Xóa thành công</span>
            </div>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th class="py-3">STT</th>
                    <th class="py-3">ID</th>
                    <th class="py-3">Tên thiết bị</th>
                    <th class="py-3">Mô tả</th>
                    <th class="py-3">Số lượng</th>
                    <th class="py-3 text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, state : ${equipments}">
                    <td th:text="${state.index + 1}">1</td>
                    <td class="fw-bold" th:text="${item.id}">#EQ-001</td>
                    <td th:text="${item.name}">Kính hiển vi quang học</td>
                    <td class="text-truncate" style="max-width: 200px;" th:text="${item.description}">
                        Mô tả thiết bị ở đây...
                    </td>
                    <td>
                        <span class="badge bg-info-subtle text-info px-3 py-2" th:text="${item.availableQuantity}">10</span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/admin/equipments/edit/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-warning" title="Sửa">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:href="@{/admin/equipments/delete/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Bạn có chắc muốn xóa thiết bị này không?')" title="Xóa">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(equipments)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fas fa-box-open d-block mb-2 fs-2"></i>
                        Chưa có thiết bị nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
