<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: main-layout(~{::#admin-dashboard}, 'Quản lý thiết bị - SmartAcademic', 'equipments')}">
<body>

<div id="admin-dashboard">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Quản lý thiết bị Lab</h3>
            <p class="text-secondary small">Thêm mới hoặc cập nhật thông tin thiết bị vào hệ thống</p>
        </div>
        <div>
            <a th:href="@{/admin/equipments}" class="btn btn-outline-secondary">
                <i class="fas fa-list me-1"></i> Xem danh sách
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-8 col-lg-10 mx-auto">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <form th:action="@{/admin/equipments/save}" th:object="${equipment}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-8 ">
                                <label class="form-label fw-bold text-dark">Tên thiết bị</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-microscope text-muted"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0 ps-0"
                                           th:field="*{name}" placeholder="Nhập tên thiết bị..." >
                                </div>
                                <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></small>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold text-dark">Số lượng</label>
                                <input type="number" class="form-control bg-light"
                                       th:field="*{availableQuantity}" min="0" placeholder="0" >
                                <small th:if="${#fields.hasErrors('availableQuantity')}" th:errors="*{availableQuantity}" class="text-danger"></small>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold text-dark">Mô tả thiết bị</label>
                                <textarea class="form-control bg-light" th:field="*{description}"
                                          rows="4" placeholder="Đặc điểm kỹ thuật, tình trạng..."></textarea>
                                <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger"></small>
                            </div>

                            <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-between align-items-center">
                                <a th:href="@{/admin/equipments}" class="text-decoration-none text-muted fw-semibold">
                                    <i class="fas fa-chevron-left me-1"></i> Hủy và quay lại
                                </a>
                                <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">
                                    <i class="fas fa-check-circle me-2"></i> Lưu thông tin
                                </button>
                            </div>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
