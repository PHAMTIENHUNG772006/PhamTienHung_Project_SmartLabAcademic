<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: main-layout(~{::#history-content}, 'Hồ sơ học thuật', 'history')}">
<body>

<div id="history-content" class="container py-4">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h3 class="fw-bold text-primary mb-1"><i class="fas fa-book me-2"></i>Hồ sơ Học thuật</h3>
            <p class="text-muted">Xem lại lịch sử tư vấn và kết quả từ giảng viên</p>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                <tr class="small text-muted text-uppercase">
                    <th class="ps-4 py-3">Thời gian</th>
                    <th>Giảng viên</th>
                    <th>Nội dung & Phòng Lab</th>
                    <th>Trạng thái</th>
                    <th class="text-end pe-4">Kết quả</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${history}">
                    <td class="ps-4">
                        <div class="fw-bold text-dark" th:text="${#temporals.format(item.startTime, 'dd/MM/yyyy')}"></div>
                        <small class="text-muted" th:text="${#temporals.format(item.startTime, 'HH:mm')}"></small>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="avatar-circle-sm bg-primary text-white me-2 d-flex align-items-center justify-content-center rounded-circle"
                                 style="width: 32px; height: 32px; font-size: 0.8rem;"
                                 th:text="${#strings.substring(item.lecturer.user.fullName, 0, 1)}"></div>
                            <div>
                                <div class="fw-bold text-dark" th:text="${item.lecturer.user.fullName}"></div>
                                <small class="text-muted" th:text="${item.lecturer.specialization}"></small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="text-dark fw-medium" th:text="${item.topic}"></div>
                        <small class="badge bg-light text-primary border fw-normal"
                               th:text="${item.lab != null ? item.lab.name : 'N/A'}"></small>
                    </td>
                    <td>
                        <span th:if="${item.status.name() == 'PENDING'}" class="badge bg-warning-subtle text-warning border border-warning-subtle px-3 rounded-pill">Chờ duyệt</span>
                        <span th:if="${item.status.name() == 'APPROVED'}" class="badge bg-info-subtle text-info border border-info-subtle px-3 rounded-pill">Đã duyệt</span>
                        <span th:if="${item.status.name() == 'COMPLETED'}" class="badge bg-success-subtle text-success border border-success-subtle px-3 rounded-pill">Hoàn thành</span>
                        <span th:if="${item.status.name() == 'REJECTED'}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 rounded-pill">Đã từ chối</span>
                        <span th:if="${item.status.name() == 'CANCELLED'}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 rounded-pill">Đã hủy</span>
                    </td>
                    <td class="text-end pe-4">
                        <!-- Nút Xem chi tiết -->
                    <td class="text-end pe-4">
                        <!-- Nút Xem chi tiết (đã có) -->
                        <div th:if="${item.academicEvaluation != null}">
                            <a th:href="@{/student/history/detail/{id}(id=${item.id})}"
                               class="btn btn-sm btn-primary rounded-pill px-3 shadow-sm">
                                <i class="fas fa-file-alt me-1"></i> Xem chi tiết
                            </a>
                        </div>


                        <div th:if="${item.status.name() == 'PENDING'}" class="mt-1">
                            <a th:href="@{/student/history/cancel/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-danger rounded-pill px-3"
                               onclick="return confirm('Bạn có chắc chắn muốn hủy yêu cầu tư vấn này không?')">
                                <i class="fas fa-times me-1"></i> Hủy lịch
                            </a>
                        </div>

                        <div th:unless="${item.academicEvaluation != null or item.status.name() == 'PENDING'}">
        <span th:if="${item.status.name() == 'COMPLETED'}" class="text-muted small italic">
            <i class="fas fa-spinner fa-spin me-1"></i> Đang chấm...
        </span>
                            <span th:unless="${item.status.name() == 'COMPLETED'}" class="text-muted small">Chưa có</span>
                        </div>
                    </td>
                    </td>
                </tr>
                <!-- Trạng thái trống -->
                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="5" class="text-center py-5 text-muted">Bạn chưa có lịch sử tư vấn nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
    .bg-primary-subtle { background-color: #eef2ff !important; }
    .bg-success-subtle { background-color: #f0fdf4 !important; }
    .bg-warning-subtle { background-color: #fffbeb !important; }
    .bg-danger-subtle { background-color: #fef2f2 !important; }
    .bg-info-subtle { background-color: #f0f9ff !important; }
</style>

</body>
</html>
