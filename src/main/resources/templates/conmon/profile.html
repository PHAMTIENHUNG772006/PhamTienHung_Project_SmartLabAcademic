<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: main-layout(~{::#profile-content}, 'Hồ sơ cá nhân', 'profile')}">
<body>

<div id="profile-content">
    <div class="mb-4">
        <h3 class="fw-bold text-primary mb-1">Cài đặt tài khoản</h3>
        <p class="text-muted">Quản lý thông tin cá nhân và bảo mật</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="bg-white p-4 rounded-4 shadow-sm text-center">
                <div class="position-relative d-inline-block mb-3">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                         style="width: 100px; height: 100px; font-size: 2rem;"
                         th:text="${#strings.substring(user.fullName,0,2).toUpperCase()}">MI</div>
                    <button class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle border-white border-3">
                        <i class="fas fa-pen fa-xs"></i>
                    </button>
                </div>
                <h5 class="fw-bold mb-1" th:text="${user.fullName}">Tên người dùng</h5>
                <p class="text-muted small" th:text="${user.role.name}">Vai trò</p>

                <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-3">
                    <small class="text-uppercase fw-bold text-muted" style="font-size: 0.7rem;">Trạng thái</small>
                    <span class="badge bg-success-subtle text-success rounded-pill">
                        <i class="fas fa-circle me-1" style="font-size: 0.5rem;"></i> Đang hoạt động
                    </span>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="bg-white p-4 rounded-4 shadow-sm">
                <h5 class="fw-bold mb-4">Thông tin chi tiết</h5>

                <form th:action="@{profile/update}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Họ và Tên</label>
                            <input type="text" class="form-control bg-light border-0 py-2" name="fullName" th:value="${user.fullName}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Email cá nhân</label>
                            <input type="email" class="form-control bg-light border-0 py-2" readonly th:value="${user.email}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Số điện thoại</label>
                            <input type="text" class="form-control bg-light border-0 py-2" name="phone" th:value="${profile?.phone}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Ngày sinh</label>
                            <input type="date" class="form-control bg-light border-0 py-2" name="dob" th:value="${profile?.dateOfBirth}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Địa chỉ thường trú</label>
                            <textarea class="form-control bg-light border-0 py-2" rows="3" name="address" th:text="${profile?.address}"></textarea>
                        </div>
                    </div>

                    <div class="row g-3 mt-2" th:if="${user.role.name == 'LECTURER'}">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Học vị</label>
                            <input type="text" class="form-control bg-light border-0 py-2" name="degree" th:value="${user.lecturer?.degree}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Chuyên môn</label>
                            <input type="text" class="form-control bg-light border-0 py-2" name="specialization" th:value="${user.lecturer?.specialization}">
                        </div>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold rounded-3 shadow-sm">
                            Cập nhật hồ sơ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
